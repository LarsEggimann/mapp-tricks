[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapp_tricks"
version = "0.1.17"
authors = [
    {name = "Lars Eggimann", email = "lars.eggimann@gmail.com"},
]
description = "Reusable code developed during my PhD in the Medical Applications of Particle Physics group at the University of Bern."

readme = "README.md"

dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-image",
    "uncertainties",
    "matplotlib",
    "plotly",
    "tqdm",
]

[project.scripts]
fluka-run = "mapp_tricks.fluka_utils.fluka_run:main"
fluka-merge = "mapp_tricks.fluka_utils.fluka_merge:main"
